[project]
name = "tagseq"
version = "2.0.0"
description = "Tag-seq analysis pipeline for CRISPR off-target detection"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "zhoujj2013", email = "zhoujj2013@gmail.com" },
]

dependencies = [
    "pysam>=0.22",
    "biopython>=1.80",
    "cutadapt>=4.0",
    "click>=8.0",
    "loguru>=0.7",
    "tqdm>=4.60",
    "matplotlib>=3.5",
    "svgwrite>=1.4",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "ruff>=0.1",
    "mypy>=1.0",
]
viz = [
    "svgwrite>=1.4",
    "pybigwig>=0.3",
]

[project.scripts]
tagseq = "tagseq.cli:main"

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.mypy]
python_version = "3.10"
strict = false
ignore_missing_imports = true
